<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Плавная анимация details</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 40px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f2f2f7;
    color: #1c1c1e;
  }

  .demo {
    max-width: 600px;
    margin: 0 auto;
  }

  h1 {
    margin: 0 0 24px;
    font-size: 24px;
  }

  details {
    background: #fff;
    border-radius: 16px;
  }

  summary {
    position: relative;
    z-index: 1;
    padding: 18px 20px;
    cursor: pointer;
    font-size: 17px;
    font-weight: 600;
    list-style: none;
    user-select: none;
  }

  summary::-webkit-details-marker {
    display: none;
  }

  summary::after {
    content: "›";
    float: right;
    font-size: 24px;
    line-height: 18px;
    transition: transform 0.3s ease;
  }

  details[open] summary::after {
    transform: rotate(90deg);
  }

  .details-wrapper {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    overflow: hidden;

    transition:
      grid-template-rows 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),
      opacity 0.2s ease;
  }

  .details-wrapper.is-open {
    grid-template-rows: 1fr;
    opacity: 1;
  }

  .details-content {
    min-height: 0;
    overflow: hidden;
  }

  .details-inner {
    padding: 0 20px 20px;
    transform: translateY(-4px);

    transition:
      transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .details-wrapper.is-open .details-inner {
    transform: translateY(0);
  }

  .details-inner p {
    margin: 0 0 12px;
    color: #636366;
    line-height: 1.55;
  }

  .details-inner p:last-child {
    margin-bottom: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .details-wrapper,
    .details-inner,
    summary::after {
      transition: none;
    }
  }
</style>
</head>

<body>

<main class="demo">
  <h1>Плавное раскрытие &lt;details&gt;</h1>

  <details id="demoDetails">
    <summary>Подробнее</summary>

    <div class="details-wrapper">
      <div class="details-content">
        <div class="details-inner">
          <p>
            Этот контент плавно появляется при открытии
            и исчезает при закрытии.
          </p>

          <p>
            Высота блока, прозрачность и вертикальное смещение
            анимируются одновременно.
          </p>

          <p>
            Попробуйте открыть и закрыть блок несколько раз —
            анимация работает в обе стороны.
          </p>
        </div>
      </div>
    </div>
  </details>
</main>

<script>
  const details = document.querySelector('#demoDetails');
  const wrapper = details.querySelector('.details-wrapper');
  const summary = details.querySelector('summary');

  summary.addEventListener('click', (event) => {
    event.preventDefault();

    if (details.open) {
      // Сначала запускаем CSS-анимацию закрытия.
      wrapper.classList.remove('is-open');

      // После завершения анимации действительно закрываем details.
      wrapper.addEventListener('transitionend', function closeHandler(e) {
        if (e.propertyName !== 'grid-template-rows') return;

        details.open = false;
        wrapper.removeEventListener('transitionend', closeHandler);
      });
    } else {
      // Открываем details, затем запускаем CSS-анимацию.
      details.open = true;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          wrapper.classList.add('is-open');
        });
      });
    }
  });
</script>

</body>
</html>
