<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Details</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
    }

    .demo {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 24px;
    }

    details {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      interpolate-size: allow-keywords;
    }

    summary {
      padding: 18px 20px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 600;
      list-style: none;
      user-select: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: "›";
      float: right;
      font-size: 24px;
      line-height: 18px;
      transition: transform 0.3s ease;
    }

    details[open] summary::after {
      transform: rotate(90deg);
    }

    details::details-content {
      block-size: 0;
      overflow: hidden;

      opacity: 0;
      transform: translateY(-4px);

      transition:
        block-size 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),
        opacity 0.2s ease,
        transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1),
        content-visibility 0.35s allow-discrete;
    }

    details[open]::details-content {
      block-size: auto;
      opacity: 1;
      transform: translateY(0);
    }

    .content {
      padding: 0 20px 20px;
      color: #636366;
      line-height: 1.55;
    }

    .content p {
      margin: 0 0 12px;
    }

    .content p:last-child {
      margin-bottom: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      details::details-content,
      summary::after {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="demo">
    <h1>Плавное раскрытие &lt;details&gt;</h1>

    <details>
      <summary>Подробнее</summary>

      <div class="content">
        <p>
          Этот контент плавно появляется при открытии
          и исчезает при закрытии.
        </p>

        <p>
          Одновременно анимируется высота блока, прозрачность
          и небольшое вертикальное смещение.
        </p>

        <p>
          Попробуйте открыть и закрыть этот блок несколько раз,
          чтобы увидеть эффект.
        </p>
      </div>
    </details>
  </main>

</body>
</html>
